#
# Publish the app to GitHub Pages. There is no build: the repo is already a static site, so this
# only copies the files the site needs into _site and hands that to Pages.
#
# The zero-config alternative is Settings > Pages > "Deploy from a branch" > main / (root), which
# works as-is because .nojekyll is committed. This workflow is here so that tools/, node_modules/
# and the git history are not published, and so a deploy can be triggered by hand.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let one deploy finish before the next starts; do not cancel a deploy in flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stage the site
        run: |
          mkdir -p _site
          cp -r index.html src data LICENSE README.md _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
