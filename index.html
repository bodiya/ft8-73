<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FT8 for Dummies</title>
<meta name="description" content="Interactive visualizations of how an FT8 decoder works, one DSP stage at a time. The real algorithms, running in your browser on a recorded 15 s window.">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0f1218">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%230f1218'/%3E%3Crect x='3' y='3' width='2' height='10' fill='%234ea1ff'/%3E%3Crect x='7' y='5' width='2' height='8' fill='%233ddc97'/%3E%3Crect x='11' y='2' width='2' height='11' fill='%23ffd166'/%3E%3C/svg%3E">
<link rel="stylesheet" href="src/ui/styles.css">
<!-- The window is 317 KB and is the last thing in the critical chain (html, app.js and its module
     graph, then this). Preloading it overlaps the download with module evaluation. -->
<link rel="modulepreload" href="src/ui/app.js">
<link rel="preload" href="data/260726_190930.wav" as="fetch" crossorigin>
</head>
<body>
<header id="topbar">
  <a class="brand" href="#home">FT8 for Dummies</a>
  <nav id="nav"></nav>
  <label class="filebtn" title="Load a 12 kHz (or any rate) mono WAV of one FT8 slot">📂 open WAV<input id="wavfile" type="file" accept=".wav,audio/wav" hidden></label><button id="btn-example" class="filebtn" title="Back to the bundled window">example</button><div id="loadstatus">loading…</div>
</header>
<div id="transport">
  <button id="btn-play" title="space">▶</button>
  <button id="btn-stop" title="home">⏮</button>
  <label>speed <input id="speed" type="range" min="-3" max="3" step="0.25" value="0"><span id="speed-val">1×</span></label>
  <label><input id="loop" type="checkbox" checked> loop</label>
  <input id="scrub" type="range" min="0" max="1" step="0.0001" value="0">
  <span id="clock-readout">0.00 s</span>
</div>
<main id="stage"></main>
<script>
if (location.protocol === 'file:') {
  document.getElementById('loadstatus').textContent = 'not served over HTTP';
  document.getElementById('stage').innerHTML = '<div class="panel" style="max-width:720px"><h3>This page has to be served over HTTP</h3><p class="note">Browsers block ES modules and fetch() on file:// URLs. From the repo directory run one of:</p><pre style="font-size:13px">npm start\npython3 -m http.server 8765\nnpx serve .</pre><p class="note">then open <a href="http://localhost:8765/" style="color:var(--accent)">http://localhost:8765/</a></p></div>';
}
</script>
<script type="module" src="src/ui/app.js"></script>
</body>
</html>
